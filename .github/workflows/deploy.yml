# Build & publish pipeline: builds the container image and pushes it to
# GitHub Container Registry. Deployment itself is a Terraform apply against
# the home-lab Docker host (deploy/terraform/), run from a machine that can
# reach it:
#
#   cd deploy/terraform
#   cp terraform.tfvars.example terraform.tfvars   # then edit
#   terraform init && terraform apply
#
# Publishing runs on every push to main (tagged latest + commit SHA) and can
# be triggered manually for any ref.

name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/api/healthz; then exit 0; fi
            sleep 1
          done
          echo "health check never passed" >&2
          docker logs smoke >&2
          exit 1

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
